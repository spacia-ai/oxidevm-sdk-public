name: Publish approved release
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      source:
        required: true
        type: string
      export_commit:
        required: true
        type: string
      candidate_sha256:
        required: true
        type: string
      review_tag:
        required: true
        type: string
      archive_sha256:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: public-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: public-release
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      PUBLICATION_APPROVED_SHA256: ${{ inputs.candidate_sha256 }}
    steps:
      - name: Require the reviewed main commit
        env:
          EXPORT_COMMIT: ${{ inputs.export_commit }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$EXPORT_COMMIT" = "$GITHUB_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.export_commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org/
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install pinned tools
        run: |
          curl --fail --location --silent --show-error https://registry.npmjs.org/pnpm/-/pnpm-11.17.0.tgz --output "$RUNNER_TEMP/pnpm.tgz"
          printf '%s  %s\n' 644eb5079654e87dae59a07e62d7f098162b9ce58f06077328b5ddefca1c8541 "$RUNNER_TEMP/pnpm.tgz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/pnpm"
          tar -xzf "$RUNNER_TEMP/pnpm.tgz" --strip-components=1 -C "$RUNNER_TEMP/pnpm"
          ln -s pnpm.mjs "$RUNNER_TEMP/pnpm/bin/pnpm"
          echo "$RUNNER_TEMP/pnpm/bin" >> "$GITHUB_PATH"
          curl --fail --location --silent --show-error https://go.dev/dl/go1.26.8.linux-amd64.tar.gz --output "$RUNNER_TEMP/go.tgz"
          printf '%s  %s\n' d0f743b33e8d8945e6b1f432edd15785c70507121d6e2a723b21285eddf8b57b "$RUNNER_TEMP/go.tgz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/go"
          tar -xzf "$RUNNER_TEMP/go.tgz" --strip-components=1 -C "$RUNNER_TEMP/go"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
      - name: Build the trusted public bootstrap
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @oxidevm/sdk build
      - name: Verify approved inputs before loading private code
        id: bootstrap
        env:
          GH_TOKEN: ${{ secrets.PUBLICATION_SOURCE_TOKEN }}
          SOURCE: ${{ inputs.source }}
          VERSION: ${{ inputs.version }}
          REVIEW_TAG: ${{ inputs.review_tag }}
          CANDIDATE: ${{ inputs.candidate_sha256 }}
          ARCHIVE: ${{ inputs.archive_sha256 }}
          EXPORT_COMMIT: ${{ inputs.export_commit }}
        run: node scripts/publication-bootstrap.ts
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: spacia-ai/oxidevm-sdk
          ref: ${{ steps.bootstrap.outputs.source }}
          token: ${{ secrets.PUBLICATION_SOURCE_TOKEN }}
          path: .publication-controller
          persist-credentials: false
      - name: Build reviewed controller
        working-directory: .publication-controller
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @oxidevm/sdk build
          pnpm exec playwright install --with-deps chromium
      - name: Download and verify approved review package
        id: review
        working-directory: .publication-controller
        env:
          GH_TOKEN: ${{ secrets.PUBLICATION_SOURCE_TOKEN }}
          REVIEW_TAG: ${{ inputs.review_tag }}
          CANDIDATE: ${{ inputs.candidate_sha256 }}
          ARCHIVE: ${{ inputs.archive_sha256 }}
          EXPORT_COMMIT: ${{ inputs.export_commit }}
        run: node scripts/public-release/download-review.ts
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: spacia-ai/oxidevm
          ref: ${{ steps.review.outputs.engine_source }}
          token: ${{ secrets.PUBLICATION_SOURCE_TOKEN }}
          path: .publication-engine
          persist-credentials: false
      - name: Publish exact approved artifacts
        working-directory: .publication-controller
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_SOURCE_TOKEN: ${{ secrets.PUBLICATION_SOURCE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PUBLICATION_CLOUDFLARE_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: node scripts/public-release/publish-public.ts "${{ steps.review.outputs.directory }}" "$PUBLICATION_APPROVED_SHA256" "$GITHUB_WORKSPACE/.publication-engine"
