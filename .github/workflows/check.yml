name: SDK source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=4096
concurrency:
  group: source-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: ${{ !github.event.repository.private || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "oxidevm-sdk-public"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Install pinned pnpm
        run: |
          curl --fail --location --silent --show-error https://registry.npmjs.org/pnpm/-/pnpm-11.17.0.tgz --output "$RUNNER_TEMP/pnpm.tgz"
          printf '%s  %s\n' 644eb5079654e87dae59a07e62d7f098162b9ce58f06077328b5ddefca1c8541 "$RUNNER_TEMP/pnpm.tgz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/pnpm"
          tar -xzf "$RUNNER_TEMP/pnpm.tgz" --strip-components=1 -C "$RUNNER_TEMP/pnpm"
          ln -s pnpm.mjs "$RUNNER_TEMP/pnpm/bin/pnpm"
          echo "$RUNNER_TEMP/pnpm/bin" >> "$GITHUB_PATH"
      - name: Install pinned Go
        run: |
          curl --fail --location --silent --show-error https://go.dev/dl/go1.26.8.linux-amd64.tar.gz --output "$RUNNER_TEMP/go.tgz"
          printf '%s  %s\n' d0f743b33e8d8945e6b1f432edd15785c70507121d6e2a723b21285eddf8b57b "$RUNNER_TEMP/go.tgz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/go"
          tar -xzf "$RUNNER_TEMP/go.tgz" --strip-components=1 -C "$RUNNER_TEMP/go"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:layout
      - run: pnpm secrets:check
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test:unit
      - run: pnpm test:cli
      - run: pnpm test:starter
      - run: pnpm test:scripts
      - run: pnpm test:packed
